name: Release

# Push a tag like v1.0.1 to build executables on all three OSes and publish a GitHub release.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            server_exe: release/server/whiteboard-server-linux-x64
            client_glob: release/client/*.AppImage
          - os: windows-latest
            server_exe: release/server/whiteboard-server-win-x64.exe
            client_glob: release/client/*.exe
          - os: macos-latest
            server_exe: release/server/whiteboard-server-macos-arm64
            client_glob: |
              release/client/*.dmg
              release/client/*.zip
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run verification
        run: |
          npm run lint
          npm test
          npm run build

      - name: Build standalone server executable
        run: npm run package:server

      - name: Smoke-test the server executable
        run: node scripts/smoke-server-binary.mjs ${{ matrix.server_exe }}

      - name: Build desktop client installers
        run: npm run package:client

      - name: Verify macOS app signatures and DMG images
        if: matrix.os == 'macos-latest'
        run: |
          shopt -s nullglob
          for app in release/client/mac*/*.app; do
            echo "Verifying code signature: $app"
            codesign --verify --deep --strict --verbose=2 "$app"
          done
          for dmg in release/client/*.dmg; do
            echo "Verifying DMG integrity: $dmg"
            hdiutil verify "$dmg"
          done

      - name: Upload server executables
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.os }}
          path: release/server/*

      - name: Upload client installers
        uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.os }}
          path: ${{ matrix.client_glob }}

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd dist-release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Render release notes body
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.env.GITHUB_REF_NAME || "";
            const version = tag.replace(/^v/, "");
            const tpl = fs.readFileSync(".github/release-body.md", "utf8");
            const out = tpl.replaceAll("{{TAG}}", tag).replaceAll("{{VERSION}}", version);
            fs.writeFileSync("release-body.md", out, "utf8");
          '

      - name: List files
        run: ls -lh dist-release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: LAN Collaborative Whiteboard ${{ github.ref_name }}
          body_path: release-body.md
          files: dist-release/*
          generate_release_notes: false
