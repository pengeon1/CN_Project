name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

      - name: Run linting
        run: npm run lint

      - name: Run typechecking
        run: npm run typecheck

      - name: Execute test suites
        run: npm test

      - name: Build packages
        run: npm run build

  # Packaging is slow, so it runs on pushes to main and on demand, not on every PR.
  package:
    name: Package (${{ matrix.os }})
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            server_exe: release/server/whiteboard-server-linux-x64
            client_glob: release/client/*.AppImage
          - os: windows-latest
            server_exe: release/server/whiteboard-server-win-x64.exe
            client_glob: release/client/*.exe
          - os: macos-latest
            server_exe: release/server/whiteboard-server-macos-arm64
            client_glob: |
              release/client/*.dmg
              release/client/*.zip
    env:
      # No Apple/Windows signing certificates are used; see docs/packaging.md.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build standalone server executable
        run: npm run package:server

      - name: Smoke-test the server executable (TCP handshake + LAN discovery)
        run: node scripts/smoke-server-binary.mjs ${{ matrix.server_exe }}

      - name: Build desktop client installers
        run: npm run package:client

      - name: Verify macOS app signatures and DMG images
        if: matrix.os == 'macos-latest'
        run: |
          shopt -s nullglob
          for app in release/client/mac*/*.app; do
            echo "Verifying code signature: $app"
            codesign --verify --deep --strict --verbose=2 "$app"
          done
          for dmg in release/client/*.dmg; do
            echo "Verifying DMG integrity: $dmg"
            hdiutil verify "$dmg"
          done

      - name: Upload server executables
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.os }}
          path: release/server/*
          retention-days: 14

      - name: Upload client installers
        uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.os }}
          path: ${{ matrix.client_glob }}
          retention-days: 14
